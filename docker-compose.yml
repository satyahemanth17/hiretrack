services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: hiretrack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hiretrack-network

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@db:5432/hiretrack
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: http://localhost:8000/auth/github/callback
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hiretrack-network

  bff:
    build: ./bff
    ports:
      - "4000:4000"
    environment:
      FASTAPI_URL: http://backend:8000
      PORT: "4000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - hiretrack-network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BFF_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hiretrack-network

volumes:
  postgres_data:
  uploads:

networks:
  hiretrack-network:
    driver: bridge
